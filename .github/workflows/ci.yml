name: FORGEHSE verification

on:
  push:
    branches: [main, "phase-*", "build/**"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: forgehse-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Typecheck, tests (with PostgreSQL) and production build
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: forgehse
          POSTGRES_PASSWORD: devpass
          POSTGRES_DB: forgehse_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U forgehse" --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      TEST_DATABASE_URL: postgres://forgehse:devpass@127.0.0.1:5432/forgehse_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: node scripts/netlify/gen-migrations.mjs
