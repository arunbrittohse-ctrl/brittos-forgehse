# Builds the BRITTO'S FORGEHSE Android app (apps/mobile) into an installable APK on GitHub's
# servers and publishes it as a release download. No Expo account is needed for this path.
# The APK is signed with the default debug key: fine for direct install and testing,
# NOT for Google Play. Use EAS or a private release keystore before a store release.
name: Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'apps/mobile/**'
      - 'packages/shared/**'
      - '.github/workflows/android-apk.yml'

permissions:
  contents: write

concurrency:
  group: android-apk
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install shared package dependencies
        run: npm install --omit=dev --no-audit --no-fund
        working-directory: packages/shared

      - name: Install app dependencies
        run: npm install --no-audit --no-fund
        working-directory: apps/mobile

      - name: Align native module versions with the Expo SDK
        run: npx expo install --fix || true
        working-directory: apps/mobile

      - name: Generate the Android project
        run: npx expo prebuild --platform android --no-install --clean
        working-directory: apps/mobile
        env:
          CI: '1'

      - name: Build release APK
        run: ./gradlew assembleRelease --no-daemon -PreactNativeArchitectures=arm64-v8a,armeabi-v7a
        working-directory: apps/mobile/android

      - name: Name the APK
        run: |
          mkdir -p out
          cp apps/mobile/android/app/build/outputs/apk/release/app-release.apk "out/BRITTOS-FORGEHSE.apk"
          ls -la out

      - uses: actions/upload-artifact@v4
        with:
          name: BRITTOS-FORGEHSE-apk
          path: out/BRITTOS-FORGEHSE.apk

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-${{ github.run_number }}
          name: "BRITTO'S FORGEHSE Android v0.2.0 (build ${{ github.run_number }})"
          make_latest: true
          body: |
            Install on Android: download BRITTOS-FORGEHSE.apk on your phone, open it, and allow "install unknown apps" when asked.
            Test build signed with a debug key — not for Google Play.
          files: out/BRITTOS-FORGEHSE.apk
