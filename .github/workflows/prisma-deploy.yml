# Deploys BRITTO'S FORGEHSE (API + web app + Prisma Postgres) to Prisma Compute on every push.
# Authentication is GitHub OIDC (id-token: write): no Prisma credential is stored in this repository.
# Pushes to main deploy production; other branches get their own preview environment.
name: prisma-deploy

on:
  push:
  workflow_dispatch:

concurrency:
  group: prisma-deploy-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write
  pull-requests: write

jobs:
  deploy:
    if: github.ref_type == 'branch'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: npm
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.13
      - run: npm ci
      - uses: prisma/cloud-deploy-action@v1
        with:
          module: module.ts
          build-command: npm run build:compute
