# Deploys BRITTO'S FORGEHSE (API + web app + Prisma Postgres) to Prisma Compute on every push.
# Authentication is GitHub OIDC (id-token: write): no Prisma credential is stored in this repository.
# Pushes to main deploy production; other branches get their own preview environment.
name: prisma-deploy

on:
  push:
  workflow_dispatch:

concurrency:
  group: prisma-deploy-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write
  pull-requests: write

jobs:
  deploy:
    if: github.ref_type == 'branch'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: npm
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.13
      - uses: prisma/cloud-deploy-action@v1
        env:
          PRISMA_COMPOSER_REPORT_FILE: ${{ runner.temp }}/deploy-report.json
        with:
          module: module.ts
          # The action passes the module positionally; this CLI version needs --entry (see the script).
          install-command: npm ci && node scripts/compute/prisma-entry-shim.mjs
          build-command: npm run build:compute
      # Surface the deploy outcome (no secrets in it) as annotations, so it is readable without the raw log.
      - name: Deploy report
        if: always()
        shell: bash
        run: |
          f="${{ runner.temp }}/deploy-report.json"
          if [ ! -f "$f" ]; then echo "::warning::No deploy report was written"; exit 0; fi
          node -e '
            const r = JSON.parse(require("fs").readFileSync(process.argv[1], "utf8"));
            const out = JSON.stringify(r, null, 1).replace(/%/g, "%25").split("\n");
            for (let i = 0; i < out.length; i += 40) console.log("::notice title=deploy report " + (i / 40 + 1) + "::" + out.slice(i, i + 40).join("%0A"));
          ' "$f"
